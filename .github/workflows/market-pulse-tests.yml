name: Market Pulse tests

on:
  pull_request:
  push:
    branches:
      - feature/seattle-market-pulse

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax and run market tests
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v
